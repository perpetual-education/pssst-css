<!doctype html>
<html
	lang="en"
	data-mode="light"
>
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>

		<title>Token pipeline demo</title>

		<!-- generated by build.js from tokens/*.json -->
		<link
			rel="stylesheet"
			href="styles/tokens.css"
		/>

		<!-- the component — consumes tokens only -->
		<link
			rel="stylesheet"
			href="styles/box.css"
		/>

		<style>
			/*
				Page chrome only — not part of the demo's token system.
				The switchers are plumbing; the box is the thing being proven.
			*/
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-content: center;
				gap: 2rem;
				padding: 3rem;
				font-family: system-ui, sans-serif;
				background-color: var(--fill-secondary);
				color: var(--ink-primary);
			}

			.switchers {
				display: flex;
				gap: 2rem;
				flex-wrap: wrap;
			}

			fieldset {
				border: 1px solid var(--stroke-primary);
				border-radius: 8px;
			}
		</style>
	</head>

	<body>
		<div class="switchers">
			<fieldset>
				<legend>brand (which ramp)</legend>

				<label><input type="radio" name="brand" value="ocean" checked /> ocean</label>

				<label><input type="radio" name="brand" value="forest" /> forest</label>

				<label><input type="radio" name="brand" value="ember" /> ember</label>
			</fieldset>

			<fieldset>
				<legend>mode (which rung)</legend>

				<label><input type="radio" name="mode" value="light" checked /> light</label>

				<label><input type="radio" name="mode" value="dark" /> dark</label>
			</fieldset>
		</div>

		<div class="box-outer">
			<p class="label">fill-secondary + stroke-primary</p>

			<div class="box-inner">
				<p class="label">fill-primary + ink-primary</p>
			</div>
		</div>

		<script>
			// Switchers do exactly one thing: write data-brand / data-mode onto
			// <html>. The generated tokens.css handles everything downstream, and
			// box.css never learns which combination it is showing.
			document.addEventListener('change', function (event) {
				const control = event.target.closest('input[type=radio]');

				if (!control) {
					return;
				}

				document.documentElement.setAttribute('data-' + control.name, control.value);
			});
		</script>
	</body>
</html>
